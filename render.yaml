services:
  - type: web
    name: telegram-miniapp-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SOURCE_CHANNEL
        sync: false
      - key: DEST_CHANNEL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_KEY
        sync: false

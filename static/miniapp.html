<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Video Player</title>

<!-- 1. Telegram Web App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- 2. Monetag SDK (आपका दिया हुआ कोड) -->
<script src='//libtl.com/sdk.js' data-zone='12127485' data-sdk='show_12127485'></script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; height: 100vh;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  
  /* वीडियो एरिया */
  #player-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; }
  video { width: 100%; max-height: 100%; display: block; }
  
  /* नीचे का एक्शन बार */
  .bottom-bar {
    padding: 15px; background: #1a1a1a; text-align: center;
    border-top: 1px solid #333;
  }
  
  #download-btn {
    background: #2ea6ff; color: #fff; border: none;
    padding: 15px; font-size: 16px; font-weight: bold;
    border-radius: 10px; cursor: pointer; width: 100%;
    transition: 0.2s;
  }
  #download-btn:active { transform: scale(0.98); }
  #download-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
  
  #status { margin-top: 10px; font-size: 14px; color: #aaa; min-height: 20px; }
</style>
</head>
<body>

<!-- वीडियो प्लेयर -->
<div id="player-container">
  <video id="player" controls playsinline preload="metadata"></video>
</div>

<!-- डाउनलोड बटन -->
<div class="bottom-bar">
  <button id="download-btn" disabled>⬇️ Download Video (Watch Ad)</button>
  <p id="status">वीडियो लोड हो रही है...</p>
</div>

<script>
(function () {
  // --- 1. Telegram WebApp Initialization ---
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  // --- 2. Get Video ID ---
  let vidId = null;
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      vidId = tg.initDataUnsafe.start_param;
  } else {
      const params = new URLSearchParams(window.location.search);
      vidId = params.get('id');
  }
  
  const player = document.getElementById('player');
  const statusEl = document.getElementById('status');
  const downloadBtn = document.getElementById('download-btn');

  if (!vidId) {
    statusEl.textContent = 'Error: Video ID missing.';
    statusEl.style.color = '#ff6b6b';
    return;
  }

  // --- 3. Load Video Instantly (No Ad Required) ---
  player.src = '/stream/' + encodeURIComponent(vidId);
  
  player.addEventListener('canplay', () => {
      statusEl.textContent = 'वीडियो तैयार है।';
      downloadBtn.disabled = false; // Enable download button
      player.play().catch(e => console.log("Autoplay blocked."));
  });

  // --- 4. Monetag Ad Logic on Download Button ---
  downloadBtn.addEventListener('click', function() {
    downloadBtn.disabled = true;
    statusEl.textContent = 'ऐड लोड हो रहा है... कृपया प्रतीक्षा करें।';
    statusEl.style.color = '#2ea6ff';

    // Check if Monetag function is loaded
    if (typeof show_12127485 === 'function') {
        
        // Call the Monetag function
        show_12127485().then(() => {
            // This code runs ONLY if the user watches the full ad
            statusEl.textContent = '✅ डाउनलोड अनलॉक हो गया!';
            statusEl.style.color = '#4caf50';
            
            // User's requested alert
            alert('You have seen an ad!');
            
            // 👇 यहाँ आप अपना असली डाउनलोड लॉजिक डाल सकते हैं। 
            // जैसे: window.open('/stream/' + vidId, '_blank');
            
        }).catch((error) => {
            // This code runs if the user skips or closes the ad early
            console.warn('Ad error/skipped:', error);
            statusEl.textContent = 'ऐड पूरा नहीं हुआ। कृपया दोबारा कोशिश करें।';
            statusEl.style.color = '#ff6b6b';
            downloadBtn.disabled = false; // Re-enable button
        });
    } else {
        statusEl.textContent = 'ऐड सर्विस लोड नहीं हो पाई। कृपया पेज रीफ्रेश करें।';
        statusEl.style.color = '#ff6b6b';
        downloadBtn.disabled = false;
    }
  });

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Video Player</title>
<!-- Telegram Web App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Adsgram SDK -->
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #start-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 20px; text-align: center;
  }
  #start-screen h2 { margin: 0 0 24px; font-weight: 600; }
  #play-btn {
    background: #2ea6ff; color: #fff; border: none;
    padding: 18px 70px; font-size: 22px; font-weight: 600;
    border-radius: 14px; cursor: pointer; transition: transform 0.1s;
  }
  #play-btn:active { transform: scale(0.97); }
  #play-btn:disabled { opacity: 0.5; cursor: wait; }
  #status { margin-top: 20px; font-size: 14px; color: #aaa; min-height: 20px; }
  #player-container { display: none; height: 100%; background: #000; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .error { color: #ff6b6b !important; }
</style>
</head>
<body>

<!-- Shuruwati Screen (PLAY Button) -->
<div id="start-screen">
  <h2>▶️ Watch Video</h2>
  <button id="play-btn">PLAY</button>
  <p id="status">Tap PLAY to watch</p>
</div>

<!-- Video Player Screen (Shuru me chhupa hua hai) -->
<div id="player-container">
  <video id="player" controls playsinline preload="metadata"></video>
</div>

<script>
(function () {
  // Telegram WebApp initialize karein
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { 
    try { tg.ready(); tg.expand(); } catch(e){} 
  }

  // URL se Video ID nikaalein
  const params = new URLSearchParams(window.location.search);
  const vidId = params.get('vid');
  
  const statusEl = document.getElementById('status');
  const playBtn = document.getElementById('play-btn');

  if (!vidId) {
    statusEl.textContent = 'Error: Video ID missing in URL.';
    statusEl.classList.add('error');
    playBtn.disabled = true;
    return;
  }

  // Adsgram Initialize karein (Block ID: 55977)
  let AdController = null;
  try {
    if (window.Adsgram) {
      AdController = window.Adsgram.init({
        blockId: "55977" 
      });
    }
  } catch (e) {
    console.warn('Adsgram init failed', e);
  }

  // Jab user PLAY button dabaye
  playBtn.addEventListener('click', async () => {
    playBtn.disabled = true;
    statusEl.classList.remove('error');
    
    // 1. Pehle Ad dikhane ki koshish karein
    if (AdController) {
      statusEl.textContent = 'Loading ad… Please wait.';
      try {
        await AdController.show(); // Ad poora hone ka wait karega
        console.log("Ad completed successfully");
      } catch (e) {
        console.warn('Ad skipped or failed:', e);
        // Agar ad fail ho jaye (moderation pending ya error), toh user ko atkao mat
      }
    }

    // 2. Ad ke baad Video play karein
    statusEl.textContent = 'Starting video…';
    showVideo();
  });

  // Video chalane ka function
  function showVideo() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('player-container').style.display = 'block';

    const player = document.getElementById('player');
    // Video source backend se set karein
    player.src = '/stream/' + encodeURIComponent(vidId);

    player.addEventListener('error', () => {
      document.getElementById('player-container').innerHTML =
        '<p style="padding:20px;color:#ff6b6b;text-align:center">Video load nahi hua. File 20MB se badi ho sakti hai.</p>';
    });

    // Video play karein
    player.play().catch(err => {
      console.warn('Autoplay blocked by browser:', err);
    });
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Video Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; height: 100vh;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  
  #player-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; max-height: 100%; display: block; }
  
  #status-overlay {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.7); padding: 8px 15px; border-radius: 20px;
    font-size: 14px; color: #2ea6ff; z-index: 10; display: none;
  }
</style>
</head>
<body>

<div id="status-overlay">Loading Ad...</div>

<div id="player-container">
  <video id="player" controls playsinline preload="metadata"></video>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  // URL ya Telegram start_param se Video ID nikaalein
  let vidId = null;
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      vidId = tg.initDataUnsafe.start_param;
  } else {
      const params = new URLSearchParams(window.location.search);
      vidId = params.get('id');
  }
  
  const player = document.getElementById('player');
  const statusOverlay = document.getElementById('status-overlay');

  if (!vidId) {
    alert("Video ID missing.");
    return;
  }

  // Video source set karein
  player.src = '/stream/' + encodeURIComponent(vidId);

  // Adsgram Init (Block ID: 55977)
  let AdController = null;
  try {
    if (window.Adsgram) {
      AdController = window.Adsgram.init({ blockId: "55977" });
    }
  } catch (e) {
    console.warn('Adsgram init failed', e);
  }

  let adTriggered = false; // Taaki ad sirf ek baar aaye

  // Jab video play hona shuru ho, tab 3 second ka timer start karein
  player.addEventListener('play', () => {
    if (adTriggered || !AdController) return;

    setTimeout(async () => {
      // Check karein ki video abhi bhi play ho rahi hai (user ne pause toh nahi kiya)
      if (player.paused) return;

      adTriggered = true;
      player.pause(); // Ad se pehle video pause karein
      statusOverlay.style.display = 'block';

      try {
        await AdController.show(); // Ad Show
        console.log("Ad watched successfully");
      } catch (e) {
        console.warn("Ad skipped or failed", e);
      }

      // Ad ke baad video wapas play karein
      statusOverlay.style.display = 'none';
      player.play().catch(err => console.log("Playback error:", err));

    }, 3000); // 3000 ms = 3 seconds
  });

})();
</script>
</body>
</html>

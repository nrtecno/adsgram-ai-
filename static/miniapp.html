<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Video Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #start-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 20px; text-align: center;
  }
  #start-screen h2 { margin: 0 0 24px; font-weight: 600; }
  #play-btn {
    background: #2ea6ff; color: #fff; border: none;
    padding: 18px 70px; font-size: 22px; font-weight: 600;
    border-radius: 14px; cursor: pointer;
    transition: transform 0.1s;
  }
  #play-btn:active { transform: scale(0.97); }
  #play-btn:disabled { opacity: 0.5; cursor: wait; }
  #status { margin-top: 20px; font-size: 13px; color: #888; min-height: 18px; }
  #player-container { display: none; height: 100%; background: #000; }
  video { width: 100%; height: 100%; display: block; background: #000; }
  .error { color: #ff6b6b !important; }
</style>
</head>
<body>

<div id="start-screen">
  <h2>▶️ Watch Video</h2>
  <button id="play-btn">PLAY</button>
  <p id="status"></p>
</div>

<div id="player-container">
  <video id="player" controls playsinline preload="metadata"></video>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  const params = new URLSearchParams(window.location.search);
  const vidId = params.get('vid');
  const devMode = params.get('dev') === '1';

  const statusEl = document.getElementById('status');
  const playBtn = document.getElementById('play-btn');

  if (!vidId) {
    statusEl.textContent = 'Video ID missing in URL.';
    statusEl.classList.add('error');
    playBtn.disabled = true;
    return;
  }

  // Adsgram init (fail hone par bhi video chalega)
  let AdController = null;
  try {
    if (window.Adsgram) {
      AdController = window.Adsgram.init({
        blockId: "YOUR_ADSGRAM_BLOCK_ID"   // <-- yahan apna blockId daalein
      });
    }
  } catch (e) {
    console.warn('Adsgram init failed', e);
  }

  playBtn.addEventListener('click', async () => {
    playBtn.disabled = true;
    statusEl.classList.remove('error');

    if (!devMode && AdController) {
      statusEl.textContent = 'Loading ad…';
      try {
        await AdController.show();
      } catch (e) {
        console.warn('Ad error/skip', e);
      }
    }

    statusEl.textContent = 'Loading video…';
    showVideo();
  });

  function showVideo() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('player-container').style.display = 'block';

    const player = document.getElementById('player');
    player.src = '/stream/' + encodeURIComponent(vidId);

    player.addEventListener('error', () => {
      console.error('video load error');
      document.getElementById('player-container').innerHTML =
        '<p style="padding:20px;color:#ff6b6b;text-align:center">Video load nahi hua. Agar file 20MB se badi hai to server support nahi karta.</p>';
    });

    player.play().catch(err => console.warn('autoplay blocked', err));
  }
})();
</script>
</body>
</html>

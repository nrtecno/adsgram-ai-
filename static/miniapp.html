<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Video Player</title>
<!-- Telegram Web App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- ========================================== -->
<!-- यहाँ Monetag का स्क्रिप्ट कोड पेस्ट करें -->
<!-- ========================================== -->
<!-- नीचे दिए गए कोड को अपने Monetag डैशबोर्ड से कॉपी किए गए कोड से बदलें -->
<script src="https://YOUR_MONETAG_DOMAIN/vignette.min.js" data-zone="YOUR_ZONE_ID" data-sdk="show_YOUR_ZONE_ID"></script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; height: 100vh;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  
  /* वीडियो एरिया */
  #player-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; }
  video { width: 100%; max-height: 100%; display: block; }
  
  /* नीचे का एक्शन बार */
  .bottom-bar {
    padding: 15px; background: #1a1a1a; text-align: center;
    border-top: 1px solid #333;
  }
  
  #download-btn {
    background: #2ea6ff; color: #fff; border: none;
    padding: 15px; font-size: 16px; font-weight: bold;
    border-radius: 10px; cursor: pointer; width: 100%;
    transition: 0.2s;
  }
  #download-btn:active { transform: scale(0.98); }
  #download-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
  
  #status { margin-top: 10px; font-size: 14px; color: #aaa; min-height: 20px; }
</style>
</head>
<body>

<!-- वीडियो प्लेयर -->
<div id="player-container">
  <video id="player" controls playsinline preload="metadata"></video>
</div>

<!-- डाउनलोड बटन -->
<div class="bottom-bar">
  <button id="download-btn">⬇️ Download Video (Watch Ad)</button>
  <p id="status">वीडियो लोड हो रही है...</p>
</div>

<script>
(function () {
  // --- 1. Telegram WebApp को इनिशियलाइज करें ---
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  // --- 2. URL या Telegram start_param से Video ID निकालें ---
  let vidId = null;
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      vidId = tg.initDataUnsafe.start_param;
  } else {
      const params = new URLSearchParams(window.location.search);
      vidId = params.get('id');
  }
  
  const player = document.getElementById('player');
  const statusEl = document.getElementById('status');
  const downloadBtn = document.getElementById('download-btn');

  if (!vidId) {
    statusEl.textContent = 'Error: Video ID missing.';
    statusEl.style.color = '#ff6b6b';
    return;
  }

  // --- 3. वीडियो सोर्स सेट करें (बिना किसी ऐड के तुरंत चलेगी) ---
  player.src = '/stream/' + encodeURIComponent(vidId);
  
  player.addEventListener('canplay', () => {
      statusEl.textContent = 'वीडियो तैयार है।';
      // बटन को एक्टिवेट करें ताकि यूजर ऐड देखकर डाउनलोड अनलॉक कर सके
      downloadBtn.disabled = false;
      // ऑटोप्ले की कोशिश करें
      player.play().catch(e => console.log("Autoplay blocked, user needs to click play."));
  });

  // --- 4. Monetag ऐड को डाउनलोड बटन से जोड़ें ---
  // Monetag स्क्रिप्ट लोड होने के बाद एक ग्लोबल फंक्शन देता है जैसे: show_1234567()
  // आपको इसे अपने Monetag कोड से मिले फंक्शन नाम से बदलना होगा।
  // उदाहरण के लिए, अगर आपका data-sdk="show_987654" है, तो फंक्शन show_987654() होगा।

  // ध्यान दें: 'show_YOUR_ZONE_ID' को अपने असली फंक्शन नाम से बदलें
  const adFunctionName = 'show_YOUR_ZONE_ID'; 

  downloadBtn.addEventListener('click', function() {
    // बटन को डिसेबल करें ताकि यूजर बार-बार क्लिक न करे
    downloadBtn.disabled = true;
    statusEl.textContent = 'ऐड लोड हो रहा है... कृपया प्रतीक्षा करें।';
    statusEl.style.color = '#2ea6ff';

    // चेक करें कि Monetag का फंक्शन लोड हो चुका है या नहीं
    if (typeof window[adFunctionName] === 'function') {
        // Monetag फंक्शन को कॉल करें (यह Promise रिटर्न करता है)
        window[adFunctionName]().then(() => {
            // ऐड पूरा होने पर यह कोड चलेगा
            statusEl.textContent = '✅ डाउनलोड अनलॉक हो गया!';
            statusEl.style.color = '#4caf50';
            
            // यहाँ आप अपना डाउनलोड लॉजिक डाल सकते हैं
            // जैसे: window.open('/stream/' + vidId, '_blank');
            
        }).catch((error) => {
            // अगर यूजर ऐड बंद कर देता है या कोई एरर आता है
            console.warn('Ad error/skipped:', error);
            statusEl.textContent = 'ऐड पूरा नहीं हुआ। कृपया दोबारा प्रयास करें।';
            statusEl.style.color = '#ff6b6b';
            downloadBtn.disabled = false; // बटन फिर से चालू करें
        });
    } else {
        // अगर स्क्रिप्ट अभी तक लोड नहीं हुई है
        statusEl.textContent = 'ऐड सर्विस लोड नहीं हो पाई। कृपया रीफ्रेश करें।';
        statusEl.style.color = '#ff6b6b';
        downloadBtn.disabled = false;
    }
  });

})();
</script>
</body>
</html>

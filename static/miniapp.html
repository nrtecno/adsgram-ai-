<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Video Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; height: 100vh;
    background: #121212; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ticket-box {
    background: #1e1e1e; border: 1px dashed #444;
    border-radius: 12px; padding: 15px 30px; margin-bottom: 30px;
    text-align: center;
  }
  .ticket-box p { margin: 0 0 5px; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px;}
  .ticket-box h3 { margin: 0; font-family: monospace; font-size: 24px; color: #2ea6ff; letter-spacing: 2px;}
  
  #play-btn {
    background: #2ea6ff; color: #fff; border: none;
    padding: 16px 60px; font-size: 20px; font-weight: 600;
    border-radius: 12px; cursor: pointer; transition: 0.2s;
    width: 100%; max-width: 300px;
  }
  #play-btn:active { transform: scale(0.95); }
  #play-btn:disabled { opacity: 0.5; cursor: wait; }
  #status { margin-top: 15px; font-size: 14px; color: #aaa; height: 20px;}
  
  #player-container { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; background: #000; }
  video { width: 100%; height: 100%; display: block; background: #000; }
</style>
</head>
<body>

<div id="main-screen" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
  <div class="ticket-box">
    <p>Video ID</p>
    <h3 id="display-id">LOADING...</h3>
  </div>
  
  <button id="play-btn">▶️ PLAY</button>
  <p id="status">Click Play to watch</p>
</div>

<div id="player-container">
  <video id="player" controls playsinline preload="metadata"></video>
</div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  // Telegram startapp parameter se ID nikaalein, ya normal URL se (testing ke liye)
  let vidId = null;
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      vidId = tg.initDataUnsafe.start_param;
  } else {
      const params = new URLSearchParams(window.location.search);
      vidId = params.get('id');
  }
  
  const displayId = document.getElementById('display-id');
  const statusEl = document.getElementById('status');
  const playBtn = document.getElementById('play-btn');

  if (!vidId) {
    displayId.textContent = "ERROR";
    statusEl.textContent = 'Video ID missing.';
    statusEl.style.color = '#ff6b6b';
    playBtn.disabled = true;
    return;
  }

  displayId.textContent = vidId;

  let AdController = null;
  try {
    if (window.Adsgram) {
      AdController = window.Adsgram.init({ blockId: "55977" });
    }
  } catch (e) {
    console.warn('Adsgram init failed', e);
  }

  playBtn.addEventListener('click', async () => {
    playBtn.disabled = true;
    statusEl.textContent = 'Loading ad…';
    statusEl.style.color = '#aaa';

    if (AdController) {
      try {
        await AdController.show(); 
      } catch (e) {
        console.warn('Ad skipped/failed', e);
      }
    }

    statusEl.textContent = 'Starting video…';
    showVideo();
  });

  function showVideo() {
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('player-container').style.display = 'block';

    const player = document.getElementById('player');
    player.src = '/stream/' + encodeURIComponent(vidId);

    player.play().catch(err => {
      console.warn('Autoplay blocked:', err);
    });
  }
})();
</script>
</body>
</html>

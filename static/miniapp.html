<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Video Player</title>

<!-- Telegram Web App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Monetag SDK (Aapka diya hua code) -->
<script src='//libtl.com/sdk.js' data-zone='12127485' data-sdk='show_12127485'></script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; height: 100vh;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  
  /* Shuruwati Screen (Play Button) */
  #start-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 20px; text-align: center;
  }
  #start-screen h2 { margin: 0 0 24px; font-weight: 600; }
  #play-btn {
    background: #2ea6ff; color: #fff; border: none;
    padding: 18px 70px; font-size: 22px; font-weight: 600;
    border-radius: 14px; cursor: pointer; transition: transform 0.1s;
  }
  #play-btn:active { transform: scale(0.97); }
  #play-btn:disabled { opacity: 0.5; cursor: wait; }
  #status { margin-top: 20px; font-size: 14px; color: #aaa; min-height: 20px; }
  
  /* Video Player Area */
  #player-container { display: none; height: 100%; background: #000; }
  video { width: 100%; height: 100%; display: block; background: #000; }
</style>
</head>
<body>

<!-- Shuruwati Screen -->
<div id="start-screen">
  <h2>▶️ Watch Video</h2>
  <button id="play-btn">PLAY</button>
  <p id="status">Tap Play to watch</p>
</div>

<!-- Video Player Screen -->
<div id="player-container">
  <video id="player" controls playsinline preload="metadata"></video>
</div>

<script>
(function () {
  // Telegram WebApp Initialize
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  // URL ya Telegram start_param se Video ID nikaalein
  let vidId = null;
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
      vidId = tg.initDataUnsafe.start_param;
  } else {
      const params = new URLSearchParams(window.location.search);
      vidId = params.get('id');
  }
  
  const player = document.getElementById('player');
  const statusEl = document.getElementById('status');
  const playBtn = document.getElementById('play-btn');

  if (!vidId) {
    statusEl.textContent = 'Error: Video ID missing.';
    statusEl.style.color = '#ff6b6b';
    playBtn.disabled = true;
    return;
  }

  // Jab user Play button dabaye
  playBtn.addEventListener('click', function() {
    playBtn.disabled = true;
    statusEl.textContent = 'Loading ad… Please wait.';
    statusEl.style.color = '#2ea6ff';

    // Monetag Ad Function Call
    if (typeof show_12127485 === 'function') {
        
        show_12127485().then(() => {
            // Ad poora hone par ye code chalega
            statusEl.textContent = 'Ad finished. Starting video…';
            statusEl.style.color = '#4caf50';
            showVideo(); // Video play karein
            
        }).catch((error) => {
            // Agar user ad skip kar de ya koi error aaye
            console.warn('Ad skipped or error:', error);
            statusEl.textContent = 'Ad skipped. Starting video…';
            statusEl.style.color = '#ff6b6b';
            // Ad fail hone par bhi video play kar dein taaki user atke nahi
            showVideo(); 
        });
    } else {
        // Agar ad blocker wagera ki wajah se script load na ho
        console.warn('Monetag script not loaded.');
        statusEl.textContent = 'Ad service unavailable. Starting video…';
        showVideo();
    }
  });

  // Video play karne ka function
  function showVideo() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('player-container').style.display = 'block';

    player.src = '/stream/' + encodeURIComponent(vidId);
    
    player.addEventListener('error', () => {
      document.getElementById('player-container').innerHTML =
        '<p style="padding:20px;color:#ff6b6b;text-align:center">Video load nahi hua. File 20MB se badi ho sakti hai.</p>';
    });

    // Video play karein
    player.play().catch(err => {
      console.warn('Autoplay blocked:', err);
    });
  }

})();
</script>
</body>
</html>
